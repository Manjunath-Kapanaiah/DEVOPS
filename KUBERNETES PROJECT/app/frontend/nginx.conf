server {
    listen 8080;

    # Serve the built React app.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # Single-page app: fall back to index.html for client-side routes.
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend Service (same job the Vite dev proxy did).
    # "backend" resolves to the backend container (docker-compose) or the backend
    # Service (Kubernetes) — both give nginx a stable name to resolve at startup.
    location /api {
        proxy_pass http://backend:8082;
    }
}
