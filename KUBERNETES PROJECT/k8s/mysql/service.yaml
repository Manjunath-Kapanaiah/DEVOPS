# Headless Service (clusterIP: None) - gives the StatefulSet pod a stable DNS name (mysql-0.mysql) and lets the backend reach the DB at "mysql:3306".
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: employee-app
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
