# LoadBalancer gives an external IP on GKE — the simplest way to reach the app from the internet. (Swap to ClusterIP if Ingress is used.)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: employee-app
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
