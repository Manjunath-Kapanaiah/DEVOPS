# Non-secret configuration shared by the backend (mirrors the env vars the app
# already honours). In K8s the datasource/redis hosts are Service DNS names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: employee-app
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employeedb
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  APP_CORS_ALLOWED_ORIGINS: "*"
