# Backend (Spring Boot) — stateless, 2 replicas, config from ConfigMap + Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: likith0129/employee-backend:1.1.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret
          resources:
            # request stays low so the HPA (B3) triggers readily under load;
            # limit allows CPU burst so cold-start boot is fast.
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          # startupProbe gates liveness/readiness until the app has booted,
          # so a slow cold start can't be mistaken for a crash (30*10s = 5 min).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15
