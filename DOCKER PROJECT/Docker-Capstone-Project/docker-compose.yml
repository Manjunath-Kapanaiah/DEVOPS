services:
  postgres:
    image: postgres:16
    container_name: registry-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registryuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (copy .env.example to .env)}
      POSTGRES_DB: ${POSTGRES_DB:-registrydb}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registryuser} -d ${POSTGRES_DB:-registrydb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE_NAME:-likith0129/registry-tracker}:${IMAGE_TAG:-latest}
    container_name: registry-tracker-app
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER:-registryuser} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-registrydb} port=5432 sslmode=disable

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
