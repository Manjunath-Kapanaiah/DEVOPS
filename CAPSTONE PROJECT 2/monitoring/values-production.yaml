# Prometheus Stack Values
prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi
    resources:
      requests:
        memory: 4Gi
        cpu: 2
      limits:
        memory: 8Gi
        cpu: 4
  
  alertmanager:
    alertmanagerSpec:
      retention: 120h
      resources:
        requests:
          memory: 256Mi
          cpu: 200m
        limits:
          memory: 512Mi
          cpu: 500m

grafana:
  adminPassword: ${GRAFANA_PASSWORD}
  persistence:
    enabled: true
    storageClassName: gp2
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  
  dashboards:
    default:
      analytics-platform:
        gnetId: 10219
        revision: 1
        datasource: Prometheus
  
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

# Alert rules
alertmanagerFiles:
  alertmanager.yml:
    global:
      slack_api_url: ${SLACK_WEBHOOK_URL}
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
      routes:
      - match:
          severity: critical
        receiver: 'slack-critical'
        continue: true
      - match:
          severity: warning
        receiver: 'slack-warning'
    
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#monitoring-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: |-
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Environment:* {{ .Labels.environment }}
          
          *Details:*
          {{ range .Alerts }}
          - *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Status:* {{ .Status }}
            *Started:* {{ .StartsAt }}
          {{ end }}
    
    - name: 'slack-critical'
      slack_configs:
      - channel: '#operations-critical'
        send_resolved: true
    
    - name: 'slack-warning'
      slack_configs:
      - channel: '#operations-warnings'
        send_resolved: true

# Custom alerts
prometheusRule:
  groups:
  - name: analytics-platform
    rules:
    - alert: HighErrorRate
      expr: |
        rate(http_requests_total{status=~"5.."}[5m]) * 100
        /
        rate(http_requests_total[5m])
        > 5
      for: 5m
      labels:
        severity: critical
        team: analytics
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value }}% for service {{ $labels.service }}"
    
    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
      for: 2m
      labels:
        severity: warning
        team: analytics
      annotations:
        summary: "Container restarting too frequently"
        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting frequently"
    
    - alert: DeploymentStuck
      expr: |
        kube_deployment_status_replicas_unavailable > 0
      for: 10m
      labels:
        severity: critical
        team: analytics
      annotations:
        summary: "Deployment stuck with unavailable replicas"
        description: "Deployment {{ $labels.deployment }} has {{ $value }} unavailable replicas"
    
    - alert: HighMemoryUsage
      expr: |
        (container_memory_working_set_bytes{container!="", container!="POD"} / container_spec_memory_limit_bytes) * 100 > 85
      for: 10m
      labels:
        severity: warning
        team: analytics
      annotations:
        summary: "Container memory usage high"
        description: "Container {{ $labels.container }} is using {{ $value }}% of its memory limit"
    
    - alert: NodeDiskPressure
      expr: |
        kube_node_status_condition{condition="DiskPressure", status="true"} == 1
      for: 5m
      labels:
        severity: critical
        team: infrastructure
      annotations:
        summary: "Node disk pressure"
        description: "Node {{ $labels.node }} is under disk pressure"
