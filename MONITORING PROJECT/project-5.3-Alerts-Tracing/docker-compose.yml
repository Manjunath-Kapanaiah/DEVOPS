# Project 5.3 — Alerting + distributed tracing.
# Stack: Prometheus + Alertmanager + node-exporter + flaky demo app
#        + Jaeger all-in-one + HotROD (sends traces to Jaeger over OTLP HTTP).
name: monitoring-5-3

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    # Alertmanager can't read ${ENV} from its config, so substitute the webhook
    # into a runtime copy (the image ships /bin/sh + sed) before starting.
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|SLACK_WEBHOOK_URL_PLACEHOLDER|${SLACK_WEBHOOK_URL:-}|" \
          /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

  flaky-app:
    build: ./flaky-app
    image: capstone/flaky-app:5.3
    container_name: flaky-app
    restart: unless-stopped
    ports:
      - "8000:8000"

  # Jaeger all-in-one: collector + query + UI + in-memory store in one container.
  # COLLECTOR_OTLP_ENABLED opens the OTLP receivers (4317 gRPC / 4318 HTTP).
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "14269:14269"   # Jaeger's own Prometheus metrics (scraped by Prometheus)
      # 4317/4318 stay on the internal network — HotROD reaches them by DNS name.

  # HotROD demo app: generates traces on each simulated ride request and exports
  # them to Jaeger over OTLP HTTP (:4318). Its own UI is on 8080 here.
  hotrod:
    image: jaegertracing/example-hotrod:1.57
    container_name: hotrod
    restart: unless-stopped
    command: ["all"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8080:8080"
    depends_on:
      - jaeger

volumes:
  prometheus_data:
