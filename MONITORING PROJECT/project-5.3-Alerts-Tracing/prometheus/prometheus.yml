# Project 5.3 — Prometheus configuration (alerting + tracing)
# Scrapes: itself, node-exporter (host), the flaky demo app, and Jaeger's own
# metrics endpoint. Sends firing alerts to Alertmanager and loads rule files.

global:
  scrape_interval: 15s
  evaluation_interval: 15s      # rules evaluated on the same cadence as scrapes
  external_labels:
    monitor: capstone-5-3

# Load recording + alerting rules. Split into files so recording and alerting
# stay separate and readable.
rule_files:
  - /etc/prometheus/rules/*.yml

# Where to ship alerts once a rule fires. Alertmanager owns grouping/routing.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: capstone-host   # stable instance label so alerts read cleanly

  # Demo app that emits a labelled request counter with ~20% 5xx.
  - job_name: flaky-app
    static_configs:
      - targets: ["flaky-app:8000"]

  # Jaeger all-in-one exposes its own Prometheus metrics on :14269 (NOT 16686).
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]
