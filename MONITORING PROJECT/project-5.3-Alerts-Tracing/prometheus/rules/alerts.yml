# Project 5.3 — Alerting rules.
# `for:` is the pending period — the condition must stay true this long before
# the alert flips to FIRING, which filters out momentary blips.

groups:
  - name: availability
    rules:
      # Any scrape target that stops responding (up == 0) for 1 minute.
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} has been unreachable (up == 0) for more than 1 minute."

  - name: app-health
    rules:
      # Built on the recording rule, not the raw query, so the threshold is the
      # only thing this rule owns. ~20% error rate clears the 10% threshold.
      - alert: HighErrorRate
        expr: job:flaky_app_requests:error_ratio > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate for job {{ $labels.job }}"
          description: "{{ $labels.job }} is serving {{ $value | humanizePercentage }} 5xx responses (threshold 10%) for over 2 minutes."
