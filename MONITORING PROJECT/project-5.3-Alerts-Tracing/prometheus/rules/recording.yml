# Project 5.3 — Recording rules.
# Recording rules precompute expensive/repeated expressions on the evaluation
# interval and store the result as a new series. Naming follows the Prometheus
# convention level:metric:operation so you can tell at a glance what a series is.

groups:
  - name: recording-host
    rules:
      # Host CPU busy percent = 100 - idle%. rate() over 5m smooths short spikes.
      # Alerts/dashboards read this one series instead of recomputing the join.
      - record: instance:node_cpu:busy_percent
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

  - name: recording-app
    rules:
      # 5xx error ratio for the demo app: 5xx rate / total rate.
      # HighErrorRate alerts off this so the alert expr stays a simple comparison.
      - record: job:flaky_app_requests:error_ratio
        expr: |
          sum by (job) (rate(app_requests_total{code=~"5.."}[5m]))
          /
          sum by (job) (rate(app_requests_total[5m]))
