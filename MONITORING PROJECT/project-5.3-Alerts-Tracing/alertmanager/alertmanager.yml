# Project 5.3 — Alertmanager configuration.
# NOTE ON THE SECRET: Alertmanager does NOT expand ${ENV} placeholders inside
# its own config. So we commit a placeholder token below and the compose file
# substitutes the real webhook from ${SLACK_WEBHOOK_URL} at container start
# (sed into a /tmp copy). That keeps the real webhook out of git.

global:
  resolve_timeout: 5m
  slack_api_url: SLACK_WEBHOOK_URL_PLACEHOLDER   # replaced at startup from env

route:
  receiver: slack-notifications
  # Group alerts that share these labels into one notification so a burst of
  # related alerts is one Slack message, not fifty.
  group_by: ["alertname", "instance"]
  group_wait: 30s          # wait 30s after the first alert to collect siblings
  group_interval: 5m       # min gap before adding new alerts to an existing group
  repeat_interval: 3h      # re-send an unresolved group at most every 3h

receivers:
  - name: slack-notifications
    slack_configs:
      - channel: "#alerts"
        send_resolved: true    # also notify when an alert clears
        title: "{{ .CommonAnnotations.summary }}"
        text: >-
          {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.description }}
          {{ end }}

# If a critical alert is firing for an instance, suppress the warning alerts for
# that same instance — you already know the box is on fire, don't double-page.
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["instance"]
