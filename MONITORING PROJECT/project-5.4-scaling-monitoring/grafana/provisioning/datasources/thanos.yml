# Project 5.4 — Grafana points at Thanos Query, NOT a single Prometheus.
# Thanos Query exposes the same HTTP query API as Prometheus, so Grafana treats
# it as a prometheus-type source. This is the whole point: one query endpoint
# that fans out to every leaf (via sidecars) and to historical data (via store).
apiVersion: 1

datasources:
  - name: Thanos
    uid: thanos
    type: prometheus
    access: proxy
    url: http://thanos-query:10902
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
