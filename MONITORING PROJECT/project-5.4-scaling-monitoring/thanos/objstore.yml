# Project 5.4 — Thanos object storage config (points at MinIO, S3-compatible).
# Dev-only credentials below match MinIO's defaults set in docker-compose.yml.
# These are well-known defaults, not real secrets. The e2e stack templates this
# file from ${MINIO_ROOT_*} at startup so nothing sensitive is committed.
type: S3
config:
  bucket: thanos
  endpoint: minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  insecure: true      # MinIO runs plain HTTP on the internal Docker network
