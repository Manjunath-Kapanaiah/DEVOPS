name: monitoring-5-4

services:
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/thanos &&
        echo "bucket 'thanos' ready"
    restart: "no"

  node-exporter-us:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-us
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  node-exporter-eu:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-eu
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  prometheus-us:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-us
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.min-block-duration=2h
      - --storage.tsdb.max-block-duration=2h
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus-us/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_us_data:/prometheus
    ports:
      - "9090:9090"

  prometheus-eu:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-eu
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.min-block-duration=2h
      - --storage.tsdb.max-block-duration=2h
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus-eu/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_eu_data:/prometheus
    ports:
      - "9092:9090"

  prometheus-fed:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-fed
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus-fed/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_fed_data:/prometheus
    ports:
      - "9091:9090"

  thanos-sidecar-us:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-sidecar-us
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus-us:9090
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - prometheus_us_data:/prometheus:ro
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  thanos-sidecar-eu:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-sidecar-eu
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus-eu:9090
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - prometheus_eu_data:/prometheus:ro
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  thanos-store:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-store
    restart: unless-stopped
    user: "0:0"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - store
      - --data-dir=/var/thanos/store
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - thanos_store_data:/var/thanos/store
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  thanos-compact:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-compact
    restart: unless-stopped
    user: "0:0"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - compact
      - --data-dir=/var/thanos/compact
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --http-address=0.0.0.0:10902
      - --wait
    volumes:
      - thanos_compact_data:/var/thanos/compact
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  thanos-query:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-query
    restart: unless-stopped
    depends_on:
      - thanos-sidecar-us
      - thanos-sidecar-eu
      - thanos-store
    command:
      - query
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
      - --query.replica-label=replica
      - --endpoint=thanos-sidecar-us:10901
      - --endpoint=thanos-sidecar-eu:10901
      - --endpoint=thanos-store:10901
    ports:
      - "10902:10902"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - thanos-query
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  minio_data:
  prometheus_us_data:
  prometheus_eu_data:
  prometheus_fed_data:
  thanos_store_data:
  thanos_compact_data:
  grafana_data:
