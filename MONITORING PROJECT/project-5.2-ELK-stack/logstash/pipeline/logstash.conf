# Project 5.2 — Logstash pipeline: Beats in -> parse -> Elasticsearch out.
input {
  beats {
    port => 5044          # Filebeat ships here (container-network only, not published)
  }
}

filter {
  # 1) grok FIRST — pull structured fields out of the raw line.
  #    log-generator writes: "<ISO8601> <LEVEL> <service> - <message>"
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{WORD:service} - %{GREEDYDATA:log_message}" }
  }

  # 2) date SECOND — it depends on log_timestamp that grok just created. If date
  #    ran before grok, @timestamp would stay the ingest time, not the event time.
  date {
    match => [ "log_timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"       # daily index; search pattern is app-logs-*
  }
}
