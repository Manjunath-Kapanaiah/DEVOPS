# Project 5.2 — Centralized Logging with the ELK Stack.
# Flow: log-generator writes a file -> Filebeat tails it -> Logstash parses it
#       (grok + date) -> Elasticsearch stores/indexes it -> Kibana searches it.
# Single-node, single EC2 host. Security is off for the demo (see Beyond-the-Basics).
name: monitoring-5-2

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # demo only; enabling it is the stretch goal
      # Heap capped at ~50% of mem_limit; the rest is Lucene/off-heap.
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    mem_limit: 2g
    healthcheck:
      # ES image ships bash; check the HTTP port is accepting connections.
      test: ["CMD-SHELL", "bash -c 'echo -n > /dev/tcp/localhost/9200'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    # Beats input (5044) is container-network only — deliberately not published.
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy          # wait until ES accepts connections
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -n > /dev/tcp/localhost/9600'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    mem_limit: 1g
    depends_on:
      elasticsearch:
        condition: service_healthy          # Kibana needs ES up before it boots
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo -n > /dev/tcp/localhost/5601'"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 90s

  log-generator:
    build: ./log-generator
    image: capstone/log-generator:5.2
    container_name: log-generator
    restart: unless-stopped
    volumes:
      - logs:/logs                          # shared with Filebeat
    mem_limit: 64m

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: ["-e", "--strict.perms=false"] # skip config-file owner check on bind mount
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - logs:/logs:ro
    mem_limit: 128m
    depends_on:
      logstash:
        condition: service_healthy
      log-generator:
        condition: service_started

volumes:
  es_data:
  logs:
