global:
  resolve_timeout: 5m
  slack_api_url: SLACK_WEBHOOK_URL_PLACEHOLDER   # replaced at startup from env

route:
  receiver: slack-notifications
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: slack-notifications
    slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: >-
          {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["instance"]
