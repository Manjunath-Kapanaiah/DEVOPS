# e2e — Federation master (scaling profile, port 9091).
# CONTRAST ONLY: classic hierarchical federation, kept to compare against the
# Thanos path. NOT part of the Thanos data flow — Thanos reads leaf data from
# the bucket via sidecars. This master pulls a curated subset from each leaf's
# /federate endpoint, which duplicates data and doesn't scale to many leaves.
global:
  scrape_interval: 15s
  external_labels:
    role: federation-master

scrape_configs:
  - job_name: federate
    honor_labels: true
    metrics_path: /federate
    params:
      "match[]":
        - '{job="prometheus"}'
        - '{job="node-exporter"}'
    static_configs:
      - targets:
          - "prometheus-us:9090"
          - "prometheus-eu:9090"
