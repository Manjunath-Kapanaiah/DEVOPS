# e2e — Logstash pipeline: Beats in -> parse -> Elasticsearch out.
input {
  beats {
    port => 5044          # Filebeat ships here (container-network only, not published)
  }
}

filter {
  # 1) grok FIRST to pull structured fields out of the raw line.
  #    Log line format (from log-generator): "<ISO8601> <LEVEL> <service> - <message>"
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{WORD:service} - %{GREEDYDATA:log_message}" }
  }

  # 2) date SECOND, because it depends on log_timestamp that grok just created.
  #    Ordering matters: if date ran before grok, log_timestamp wouldn't exist yet
  #    and @timestamp would stay as the ingest time, not the event time.
  date {
    match => [ "log_timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Daily index; verify.sh checks app-logs-* exists with docs > 0.
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
