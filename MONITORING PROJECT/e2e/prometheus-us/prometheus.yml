global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    region: us-east
    replica: A

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: us-host
