# e2e — Central Prometheus (the single metrics DB for the whole platform).
# Scrapes host + container + app + tracing-backend metrics, evaluates the
# recording/alert rules, and ships alerts to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: e2e-central

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: e2e-host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: flaky-app
    static_configs:
      - targets: ["flaky-app:8000"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
